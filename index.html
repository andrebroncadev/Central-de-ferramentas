<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f5f1">
<title>Central de Ferramentas</title>
<style>
:root{color-scheme:light;--bg:#f6f5f1;--surface:#fffefa;--surface-2:#e9e8e5;--surface-3:#d5d4d0;--text:#28292d;--muted:#6f7075;--line:#d8d6d0;--gold:#b49350;--red:#b52332;--navy:#17324f;--green:#26734d}
html[data-theme="dark"]{color-scheme:dark;--bg:#222326;--surface:#2d2f33;--surface-2:#383a3f;--surface-3:#484a4f;--text:#f4f1e8;--muted:#b8b5ad;--line:#4b4c50;--gold:#d2b46b;--red:#d94a57;--navy:#294b6d;--green:#3b9a68}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center;padding:28px}
main{width:min(760px,100%)}
.brand{font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-top:28px}
h1{font-size:clamp(2rem,7vw,3.3rem);line-height:1.08;letter-spacing:-.04em;margin:.6rem 0}
.intro{color:var(--muted);margin:0 0 28px}
.list{display:grid;gap:14px}
.tool{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--text);text-decoration:none;transition:transform .15s,border-color .15s,background .15s}
.tool:hover,.tool:focus-visible{transform:translateY(-2px);border-color:var(--gold);background:var(--surface-2);outline:none}
.symbol{width:46px;height:46px;flex:0 0 46px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--navy);font-size:1.35rem}
.copy{flex:1;min-width:0}.copy strong{display:block;font-size:1.08rem}.copy span{display:block;color:var(--muted);font-size:.92rem;margin-top:3px}
.arrow{color:var(--red);font-size:1.35rem}
footer{margin-top:26px;color:var(--muted);font-size:.82rem}
.theme-toggle{position:fixed;right:16px;bottom:16px;z-index:9999;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:9px 13px;background:var(--surface);color:var(--text);font:600 12px/1.2 system-ui,sans-serif;box-shadow:0 3px 14px #00000016;opacity:.88;cursor:pointer}
.theme-toggle:hover,.theme-toggle:focus-visible{opacity:1;outline:2px solid var(--gold);outline-offset:2px}
@media(min-width:640px){.list{grid-template-columns:1fr 1fr}.tool:first-child{grid-column:1/-1}}
@media(max-width:600px){body{padding:22px 16px}.theme-toggle{right:10px;bottom:10px;padding:8px 11px;font-size:11px}}
@media print{.theme-toggle{display:none!important}}
</style>
</head>
<body><main>
<div class="brand">Área interna · EBIMOB</div>
<div class="eyebrow">Central de Ferramentas</div>
<h1>Suas ferramentas de trabalho.</h1>
<p class="intro">Acesse rapidamente os sistemas internos.</p>
<section class="list" aria-label="Ferramentas">
<a class="tool" href="https://bancoimob-bronca.vercel.app/" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">⌂</span><span class="copy"><strong>BancoImob</strong><span>Base e administração de imóveis</span></span><span class="arrow" aria-hidden="true">↗</span></a>
<a class="tool" href="https://feedback-maker-bronca.vercel.app/" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">▤</span><span class="copy"><strong>Feedback Maker</strong><span>Geração de feedbacks de imóveis</span></span><span class="arrow" aria-hidden="true">↗</span></a>
<a class="tool" href="https://contrato-generator-bronca.vercel.app/" target="_blank" rel="noopener noreferrer"><span class="symbol" aria-hidden="true">✎</span><span class="copy"><strong>Contrato Generator</strong><span>Geração de contratos</span></span><span class="arrow" aria-hidden="true">↗</span></a>
</section><footer>Ferramentas internas · RE/MAX Soul</footer></main>
<script>(function(){const key='remax-unified-theme',root=document.documentElement;let theme='light';try{theme=localStorage.getItem(key)||'light'}catch(e){}const b=document.createElement('button');b.type='button';b.id='themeToggle';b.className='theme-toggle';b.title='Alternar entre modo claro e escuro';function apply(t){root.dataset.theme=t;b.textContent=t==='dark'?'☀ Modo claro':'☾ Modo escuro';b.setAttribute('aria-pressed',String(t==='dark'));b.setAttribute('aria-label',t==='dark'?'Ativar modo claro':'Ativar modo escuro');const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=t==='dark'?'#222326':'#f6f5f1'}b.addEventListener('click',()=>{theme=root.dataset.theme==='dark'?'light':'dark';apply(theme);try{localStorage.setItem(key,theme)}catch(e){}});apply(theme);document.body.appendChild(b)})();</script>
</body></html>
